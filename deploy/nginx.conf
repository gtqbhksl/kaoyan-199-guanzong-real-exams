server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    # 题库数据与页面脚本体积较大,给足读取时间
    client_max_body_size 4m;
    sendfile      on;
    tcp_nopush    on;

    # 站点是单页 hash 路由(#practice / #mistakes / #skills),
    # 浏览器请求的路径始终是 "/" 或静态资源路径,不需要 SPA 回退;
    # 缺失的资源直接 404,不要回退成 index.html,否则图片 404 会被
    # 200 的 HTML 掩盖,排障时看不出真实问题。
    location / {
        try_files $uri $uri/ =404;
    }

    # 生成数据:内容随题库更新变化,不长缓存
    location ~* ^/data/.*\.js$ {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # 原卷切片图(WebP):文件名含年份与题号,内容稳定,可长缓存
    location ~* ^/scans/.*\.webp$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # 页面与样式:始终取最新,避免发版后拿到旧壳
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # 站点图标等小资源
    location ~* \.(ico|png|jpg|jpeg|gif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
    }
}
